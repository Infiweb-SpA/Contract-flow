{% extends 'base.html' %}

{% block title %}Crear Nuevo Rol — SIGH-MUNI{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-white">Crear Nuevo Rol</h1>
            <p class="text-sm text-slate-300 mt-1">Crear un nuevo rol para la plataforma SIGH-MUNI.</p>
        </div>
        <div class="flex gap-2">
            <a href="{{ url_for('admin.roles') }}" class="px-4 py-2 bg-white border border-slate-300 rounded-md text-sm font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                Volver a Lista
            </a>
        </div>
    </div>

    <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 bg-slate-50">
            <form method="POST" class="space-y-4">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="role_name">
                        Nombre del Rol
                    </label>
                    <input type="text" id="role_name" name="role_name" required class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] focus:border-[color:#1e3a8a]">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1" for="description">
                        Descripción (opcional)
                    </label>
                    <textarea id="description" name="description" rows="3" class="w-full px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-[#1e3a8a] focus:border-[color:#1e3a8a]"></textarea>
                </div>
                <button type="submit" class="px-6 py-2 bg-[#1e3a8a] hover:bg-[#0f265c] text-white rounded-md text-sm font-semibold shadow-sm transition-colors">
                    Crear Rol
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
